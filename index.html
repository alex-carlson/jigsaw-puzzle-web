<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigsaw Puzzle</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <aside id="pieceShelf" class="is-closed">
        <div class="shelfHeader">
            <span>Shelf</span>
            <button id="shelfToggle" type="button" aria-label="Open shelf" title="Open shelf">&rsaquo;</button>
        </div>
        <div id="shelfStorage"></div>
    </aside>
    <div id="dragLayer"></div>
    <header class="taskBar">
        <h1 aria-label="Jigsaw puzzle">&#129513;</h1>
        <label for="pieceCount">Pieces</label>
        <select id="pieceCount">
            <option value="24" data-columns="6">24</option>
            <option value="48" data-columns="8">48</option>
            <option value="96" data-columns="12" selected>96</option>
            <option value="192" data-columns="16">192</option>
        </select>
        <details class="imageMenu">
            <summary><span class="icon" aria-hidden="true">&#128444;</span><span>Image</span></summary>
            <div class="imageMenuPanel">
                <label for="imageUpload">Upload image</label>
                <input id="imageUpload" type="file" accept="image/*">
            </div>
        </details>
        <button id="newGame" type="button" aria-label="New game">
            <span class="icon" aria-hidden="true">&#8635;</span><span class="buttonLabel">New game</span>
        </button>
    </header>
    <div id="viewport">
        <div id="world">
            <div class="wrapper">
                <img id="puzzleSrc" alt="">
                <div id="puzzleContainer"></div>
            </div>
        </div>
    </div>
    <aside id="imagePreview">
        <img id="imagePreviewSource" alt="Puzzle image preview" draggable="false">
        <div class="previewControls" aria-label="Preview controls">
            <button id="previewZoomOut" type="button" aria-label="Zoom out preview"
                title="Zoom out preview">&minus;</button>
            <button id="previewZoomIn" type="button" aria-label="Zoom in preview"
                title="Zoom in preview">&plus;</button>
        </div>
    </aside>
    <div id="completionMessage" class="completionMessage" role="dialog" aria-modal="true"
        aria-labelledby="completionTitle" hidden>
        <div class="completionPanel">
            <h2 id="completionTitle">Congratulations!</h2>
            <p>You did it! Nice work, would you like to do another one?</p>
            <button id="completionNewGame" type="button">Start a new game</button>
        </div>
    </div>
    <nav class="viewControls" aria-label="View controls">
        <button id="zoomOut" type="button" aria-label="Zoom out" title="Zoom out">&minus;</button>
        <button id="recenterView" type="button" aria-label="Recenter view" title="Recenter view">&#8982;</button>
        <button id="zoomIn" type="button" aria-label="Zoom in" title="Zoom in">&plus;</button>
    </nav>
    <script type="module" src="main.js"></script>
</body>

</html>
